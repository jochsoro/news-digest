@let m = meta();
<article class="card" [style.--cat]="m?.color">
  <header class="card-head">
    <span class="chip">
      <span class="chip-icon">{{ m?.icon }}</span>
      {{ m?.label }}
    </span>
    <button class="icon-btn" (click)="dismissed.emit(block())" aria-label="Masquer ce thème" title="Moins de ça">
      ✕
    </button>
  </header>

  <p class="summary">{{ block().summary }}</p>

  @if (block().sources.length) {
    <div class="sources">
      @for (s of block().sources; track s.url) {
        <a
          class="source-link"
          [href]="s.url"
          target="_blank"
          rel="noopener noreferrer"
          (click)="onOpenSource()"
        >
          <span class="source-title">{{ s.title }}</span>
          <span class="source-name">{{ s.source }} ↗</span>
        </a>
      }
    </div>
  }

  <footer class="card-foot">
    <button class="text-btn" (click)="saved.emit(block())">☆ Enregistrer</button>
  </footer>
</article>
